<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="FileChecker adds a direct Open location button to a delivered-file card in DeepSeek Harness">
  <rect width="960" height="360" rx="20" fill="#f6f8fb"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <g transform="translate(48 36)">
      <rect width="38" height="38" rx="10" fill="#0f5f8a"/>
      <path d="M9 14.5c0-1.4 1.1-2.5 2.5-2.5h5.2l2.4 2.4h7.4c1.4 0 2.5 1.1 2.5 2.5v8.6c0 1.4-1.1 2.5-2.5 2.5h-15c-1.4 0-2.5-1.1-2.5-2.5z" fill="#eaf3ff"/>
      <path d="M9 18.5h20v7c0 1.4-1.1 2.5-2.5 2.5h-15c-1.4 0-2.5-1.1-2.5-2.5z" fill="#bcd7f5"/>
      <circle cx="27" cy="27" r="4.6" fill="#0f5f8a" stroke="#ffd166" stroke-width="1.8"/>
      <path d="M30.4 30.4l3.4 3.4" stroke="#ffd166" stroke-width="2.2" stroke-linecap="round"/>
    </g>

    <text x="98" y="55" fill="#1c2733" font-size="24" font-weight="700">FileChecker</text>
    <text x="98" y="78" fill="#5b6b7c" font-size="13">A DSH plugin · one-click file reveal</text>

    <rect x="790" y="40" width="122" height="30" rx="15" fill="#e8f1ff"/>
    <text x="851" y="60" fill="#1f6feb" font-size="12" font-weight="600" text-anchor="middle">DSH plugin</text>

    <rect x="48" y="104" width="864" height="220" rx="16" fill="#ffffff" stroke="#dbe4ee"/>
    <path d="M48 144h864" stroke="#edf1f6"/>
    <circle cx="70" cy="124" r="4" fill="#e3e9f1"/>
    <circle cx="84" cy="124" r="4" fill="#e3e9f1"/>
    <circle cx="98" cy="124" r="4" fill="#e3e9f1"/>
    <text x="116" y="129" fill="#5b6b7c" font-size="12" font-weight="600">DeepSeek Harness</text>
    <text x="886" y="129" fill="#8a98a8" font-size="11" text-anchor="end">Session</text>

    <text x="80" y="178" fill="#33414f" font-size="14">Report is ready — preview it, or jump straight to its folder.</text>

    <rect x="80" y="194" width="800" height="86" rx="12" fill="#fbfcfe" stroke="#dbe4ee"/>

    <rect x="96" y="210" width="54" height="54" rx="10" fill="#e8f1ff"/>
    <path d="M111 224h19l7 7v17.5c0 2.5-2 4.5-4.5 4.5h-21.5c-2.5 0-4.5-2-4.5-4.5v-20c0-2.5 2-4.5 4.5-4.5z" fill="#ffffff" stroke="#1f6feb" stroke-width="2" stroke-linejoin="round"/>
    <path d="M130 224v7h7" fill="none" stroke="#1f6feb" stroke-width="2" stroke-linejoin="round"/>
    <path d="M116 238h13M116 244h9" stroke="#8fb8e8" stroke-width="2" stroke-linecap="round"/>

    <text x="166" y="235" fill="#1c2733" font-size="16" font-weight="600">Q3-report.docx</text>
    <text x="166" y="257" fill="#7a8797" font-size="12">Quarterly report · 248 KB</text>

    <rect x="686" y="221" width="30" height="30" rx="7" fill="#f2f5f9" stroke="#dbe4ee"/>
    <path d="M695 233h6l1.6 1.6h6.4v8.4h-14z" fill="none" stroke="#7a8797" stroke-width="1.6" stroke-linejoin="round"/>

    <rect x="728" y="220" width="136" height="36" rx="9" fill="#1f6feb"/>
    <path d="M745 240h6.4l1.7 1.7h7.4v9.8h-15.5z" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="806" y="243" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Open location</text>

    <text x="80" y="306" fill="#8a98a8" font-size="11">The built-in native control stays; FileChecker makes reveal one visible click.</text>
  </g>
</svg>
